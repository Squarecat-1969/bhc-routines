name: Reconciler Fix

# Repairs what the read-only Reconciler flagged: S1 (flag only), A1, A3, S4, I1.
# The only routine here that writes to Attio, and the only one that writes
# Master_ID cols C/E/F. Col A is never written, in any pass, for any reason.
#
# MODE BY TRIGGER, and the two halves are deliberately different:
#
#   • The UNATTENDED paths (schedule, workflow_run) run LIVE. This routine
#     exists to repair, and a weekly job that only ever reports what it would
#     have done never actually fixes anything.
#   • MANUAL dispatch stays DRY-RUN BY DEFAULT, live only on explicit opt-in.
#     That is a separate safety property and it is unchanged — a human at a
#     keyboard should have to say "yes, live" out loud.
#
# WHY THE UNATTENDED PATHS WERE LOOSENED (2026-08-21). They ran dry from the
# day this file was written, deliberately, because two interaction bugs were
# open — both of which corrupted data in exactly the "nobody is watching" shape
# an unattended live run has:
#
#   PR #19  A1 acted on an Attio pointer S4 was still adjudicating, overwrote a
#           shared record with the wrong claimant's BHC_ID, and S4 then cleared
#           the TRUE owner's pointer after reading back what A1 had corrupted.
#   PR #20  I1 synced identity fields onto BOTH records of an S1-disputed
#           BHC_ID, each row's own gate passing correctly while no human had
#           yet decided which row was the real person.
#
# Both are closed, each reproduced on pre-fix code before being fixed and each
# pinned by a mutation-checked test. That is what changed; nothing about the
# routine's write surface did.
#
# THREE TRIGGERS, mirroring reconciler.yml:
#
#   1. workflow_dispatch — on demand, DRY-RUN by default, live on opt-in.
#
#   2. schedule — Sunday 10:00 UTC = 3am PDT / 2am PST, one hour AFTER
#      Reconciler's 2am slot, for the same reason Resync IDs sits an hour
#      before it: the pass that produces the findings should land before the
#      pass that consumes them. The gap is a courtesy, not the mechanism —
#      GitHub cron is best-effort, so ORDER is guaranteed by the chain below.
#
#      RUNS LIVE. It ran dry until 2026-08-21 while the A1/S4 and I1/S1
#      interaction bugs were open (see the header). With those closed, the
#      weekly sweep repairs rather than merely reporting — the report artifact
#      is still uploaded either way, so the run is auditable after the fact.
#
#   3. workflow_run — chained off Reconciler's completion, success only. A
#      failed audit means the findings are unreliable, and repairing against
#      unreliable findings is worse than not repairing.
#
# The full chain, once all three are on main:
#   Resync IDs -> Reconciler -> Reconciler Fix

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run reads everything and issues no writes; live writes Master_ID and Attio'
        required: true
        default: 'dry-run'
        type: choice
        options: [dry-run, live]

  schedule:
    - cron: '0 10 * * 0'

  workflow_run:
    workflows: ['Reconciler']
    types: [completed]

concurrency:
  group: reconciler-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    # `github.event.workflow_run` is null for schedule and dispatch, so testing
    # conclusion alone would evaluate false and silently disable both.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # Schedule and workflow_run run LIVE; manual dispatch reads the dropdown
      # and defaults to dry-run.
      #
      # The condition is written as "dispatch AND NOT live -> dry" rather than
      # "schedule OR workflow_run -> live" on purpose. Only workflow_dispatch
      # has an `inputs` context — it is null for the other two — so anchoring
      # the test on the one trigger that HAS the input keeps the other two from
      # depending on an expression that cannot evaluate for them. It also fails
      # safe: a trigger nobody has thought of yet lands in the live branch only
      # by being explicitly not-a-dry-dispatch, and any future dispatch-shaped
      # trigger inherits the dry default rather than silently escalating.
      - name: Run Reconciler Fix
        env:
          BRAIN_API_TOKEN: ${{ secrets.BRAIN_API_TOKEN }}
          SHEETS_PROXY_URL: ${{ secrets.SHEETS_PROXY_URL }}
          ATTIO_API_KEY: ${{ secrets.ATTIO_API_KEY }}
          ATTIO_API_BASE: ${{ secrets.ATTIO_API_BASE }}
          ZAPIER_SLACK_HOOK_URL: ${{ secrets.ZAPIER_SLACK_HOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" != "live" ]; then
            npm run reconciler-fix -- --dry-run --json-out out/reconciler-fix-report.json
          else
            npm run reconciler-fix -- --live --json-out out/reconciler-fix-report.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reconciler-fix-report-${{ github.run_id }}
          path: out/reconciler-fix-report.json
          retention-days: 7
          if-no-files-found: warn
