name: Resync IDs

# Re-derives Master_ID.Google_Row from Contacts col A. Writes ONLY Master_ID
# col D, one explicit range per correction, each read back before it counts.
#
# TWO TRIGGERS, and the on-demand one is the point:
#
#   1. workflow_dispatch — the actual gap this routine was built to close.
#      Deleting a Contacts row silently invalidates every Master_ID pointer
#      below it. Waiting up to a week for a schedule to notice is the whole
#      problem, so this runs on demand, immediately after a manual delete.
#      ("Call via API" for the Claude Code routines is the same idea.)
#
#   2. schedule — Sunday 09:00 UTC = 1am Pacific (PDT), deliberately ONE HOUR
#      BEFORE Reconciler's 2am slot. Resync repairs pointers; Reconciler then
#      audits and reports on what remains. Running them the other way round
#      would have Reconciler flag drift that Resync was about to fix, every
#      single week.
#
# GITHUB CRON IS BEST-EFFORT and was observed running Late Edition 2.5-4 hours
# late every night (see late-edition.yml's header for that history). A one-hour
# gap before Reconciler is therefore a nominal ordering, not a guarantee. If
# the ordering ever has to be real, follow Late Edition's path: a Zap POSTing
# to each workflow's dispatch endpoint in sequence.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run computes and reports without writing; live writes Master_ID col D'
        required: true
        default: 'dry-run'
        type: choice
        options: [dry-run, live]
  schedule:
    # Sunday 08:00 UTC = 1am PDT / 12am PST — one hour before Reconciler's 2am
    # slot, so the repair pass lands before the audit that reports on it.
    #
    # CORRECTED 2026-08-19: this was '0 9 * * 0' with a comment claiming 1am
    # Pacific. It is not — 09:00 UTC is 2am PDT, the same slot Reconciler runs
    # in, so the documented one-hour gap never actually existed and the two
    # standalone schedules fired simultaneously. Verified against a real Sunday
    # in both PDT and PST before changing it.
    #
    # Deliberately not paired with a second DST-covering entry: this routine is
    # idempotent (a second run finds zero corrections and writes nothing), so an
    # hour of seasonal drift costs nothing, unlike Late Edition where a
    # DST-covering cron pair caused a real double-run bug.
    - cron: '0 8 * * 0'

concurrency:
  group: resync-ids
  cancel-in-progress: false

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # A scheduled run has no `inputs` context at all, so it must not branch on
      # one — the exact bug that would have left Late Edition in dry-run forever.
      # Schedule always runs live; manual dispatch respects the dropdown.
      - name: Run Resync IDs
        env:
          BRAIN_API_TOKEN: ${{ secrets.BRAIN_API_TOKEN }}
          SHEETS_PROXY_URL: ${{ secrets.SHEETS_PROXY_URL }}
          ZAPIER_SLACK_HOOK_URL: ${{ secrets.ZAPIER_SLACK_HOOK_URL }}
          # UNUSED BY THIS ROUTINE. Resync IDs never touches Attio — it reads
          # Master_ID and Contacts and writes Master_ID col D, nothing else.
          # These are here only because loadEnv() (src/config/env.ts) validates
          # its ENTIRE schema on every call regardless of which routine is
          # asking, and ATTIO_API_KEY is non-optional there. Without them the
          # job dies at startup with "Invalid environment: ATTIO_API_KEY:
          # Required" before issuing a single read — which is exactly what
          # happened on run 32311256297 (2026-08-19), and which silently took
          # the Reconciler chain down with it (a failed Resync means
          # conclusion != success, so the audit is skipped).
          #
          # KNOWN FOLLOW-UP, deliberately not done here: loadEnv() should
          # validate only what a given routine actually needs. That is the real
          # fix, and it belongs in its own change — it touches a shared module
          # every workflow depends on, and this was the tail end of a long
          # session. Passing a credential to a routine that cannot use it is
          # the lower-risk placeholder, not the intended end state.
          ATTIO_API_KEY: ${{ secrets.ATTIO_API_KEY }}
          ATTIO_API_BASE: ${{ secrets.ATTIO_API_BASE }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "live" ]; then
            npm run resync-ids -- --live --json-out out/resync-ids-report.json
          else
            npm run resync-ids -- --dry-run --json-out out/resync-ids-report.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resync-ids-report-${{ github.run_id }}
          path: out/resync-ids-report.json
          # Contains BHC_IDs and row numbers only — no names, no thread content.
          # Short retention anyway, same as every other routine here.
          retention-days: 7
          if-no-files-found: warn
